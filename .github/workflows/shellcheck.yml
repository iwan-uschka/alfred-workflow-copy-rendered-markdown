name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh build.sh make_release.sh test/*.test.sh

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install pandoc
      - run: bash test/copy-rendered-markdown.test.sh
